name: Synthetic merge ref dispatch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Inspect checked-out commit and parents
        run: |
          git rev-parse HEAD
          git cat-file -p HEAD | sed -n 's/^parent //p'
